<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auckland Chess Academy — Members Login</title>

<!--
=============================================================
  HOW TO MANAGE MEMBERS
=============================================================
  Passwords are stored as SHA-256 hashes — never plain text.

  TO ADD A MEMBER:
  1. Go to https://emn178.github.io/online-tools/sha256.html
  2. Type the password and copy the hash output.
  3. Add a new line to the MEMBERS object below:
       "username": "paste-hash-here",

  TO REMOVE A MEMBER:
  Delete their line from the MEMBERS object.

  TO CHANGE A PASSWORD:
  Generate a new hash and replace the old one.

  TEST ACCOUNTS (delete these before going live):
    admin   / Admin@ACA2026
    member1 / Chess@2026
    member2 / Knight@ACA

  MEMBERS PAGE URL:
  Update MEMBERS_PAGE_URL below to your actual members page URL.
=============================================================
-->

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Open Sans', Arial, sans-serif;
    background: #f7f4f4;
    color: #1e1515;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .login-card {
    background: #fff;
    border: 1px solid #e2d5d5;
    border-radius: 8px;
    overflow: hidden;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 24px rgba(107,18,18,0.10);
  }

  .login-header {
    background: #6b1212;
    padding: 28px 24px 22px;
    text-align: center;
    border-bottom: 3px solid #8a1a1a;
  }

  .login-header .chess-icon {
    font-size: 40px;
    display: block;
    margin-bottom: 10px;
  }

  .login-header h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  .login-header p {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 5px;
  }

  .login-body {
    padding: 28px 28px 24px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #6b5555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    height: 38px;
    border: 1px solid #e2d5d5;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 14px;
    font-family: 'Open Sans', Arial, sans-serif;
    color: #1e1515;
    background: #fff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .form-group input:focus {
    border-color: #6b1212;
    box-shadow: 0 0 0 3px rgba(107,18,18,0.12);
  }

  .show-pw-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    margin-bottom: 20px;
  }

  .show-pw-row input[type="checkbox"] {
    width: 14px;
    height: 14px;
    cursor: pointer;
    accent-color: #6b1212;
  }

  .show-pw-row label {
    font-size: 12px;
    color: #6b5555;
    cursor: pointer;
  }

  .btn-login {
    width: 100%;
    height: 42px;
    background: #6b1212;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .btn-login:hover { background: #8a1a1a; }
  .btn-login:active { transform: scale(0.98); }

  .error-msg {
    display: none;
    background: #fff5f5;
    border: 1px solid #fecaca;
    border-radius: 6px;
    color: #b91c1c;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 14px;
    margin-top: 14px;
    text-align: center;
  }

  .error-msg.visible { display: block; }

  .login-footer {
    text-align: center;
    padding: 14px 24px 18px;
    border-top: 1px solid #f0e8e8;
  }

  .login-footer a {
    font-size: 12px;
    color: #6b1212;
    text-decoration: none;
    font-weight: 600;
  }

  .login-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <span class="chess-icon">♟</span>
    <h1>Auckland Chess Academy</h1>
    <p>Members Area — Please sign in</p>
  </div>

  <div class="login-body">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="Enter your username">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password">
    </div>

    <div class="show-pw-row">
      <input type="checkbox" id="show-pw" onchange="togglePassword()">
      <label for="show-pw">Show password</label>
    </div>

    <button class="btn-login" onclick="doLogin()">Sign In →</button>
    <div class="error-msg" id="error-msg">Incorrect username or password. Please try again.</div>
  </div>

  <div class="login-footer">
    <a href="https://www.aucklandchessacademy.com" target="_blank">← Back to Auckland Chess Academy</a>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────
  //  MEMBERS LIST
  //  Format: "username": "sha256-hash-of-password"
  //
  //  To generate a hash: https://emn178.github.io/online-tools/sha256.html
  //  Delete test accounts before going live!
  // ─────────────────────────────────────────────
  const MEMBERS = {
    "admin":   "8f5cff09b5a8328ceb60c00e2bb34a02c416a02b9d0715d6d76e22f7278e167d", // Admin@ACA2026
    "member1": "802a932c68fcde16a8cdf2968478eaac3c7e8bf68d8fc6da4ccff0e71c305360", // Chess@2026
    "member2": "572009fe8361c11dfd49251135154ad888f6ca7080b62229a23fc536bd5982c5", // Knight@ACA
  };

  // ─────────────────────────────────────────────
  //  MEMBERS PAGE URL — update this!
  // ─────────────────────────────────────────────
  const MEMBERS_PAGE_URL = 'https://www.aucklandchessacademy.com/membersonly';

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function togglePassword() {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  }

  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function doLogin() {
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errorEl  = document.getElementById('error-msg');

    errorEl.classList.remove('visible');

    if (!username || !password) {
      errorEl.textContent = 'Please enter both your username and password.';
      errorEl.classList.add('visible');
      return;
    }

    const hash = await sha256(password);

    if (MEMBERS[username] && MEMBERS[username] === hash) {
      // Store session token and username
      const token = await sha256(username + hash + Date.now());
      sessionStorage.setItem('aca_token', token);
      sessionStorage.setItem('aca_user', username);
      sessionStorage.setItem('aca_token_hash', hash);
      window.location.href = MEMBERS_PAGE_URL;
    } else {
      errorEl.textContent = 'Incorrect username or password. Please try again.';
      errorEl.classList.add('visible');
      document.getElementById('password').value = '';
    }
  }
</script>
</body>
</html>
